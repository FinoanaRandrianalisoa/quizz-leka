<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification de votre email</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
          <tr>
            <td style="background-color:#6C63FF;padding:30px;text-align:center;">
              <h1 style="color:#ffffff;margin:0;font-size:24px;">Quizz Leka</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:40px 30px;text-align:center;">
              <h2 style="color:#333333;margin:0 0 16px;font-size:20px;">Vérification de votre adresse email</h2>
              <p style="color:#666666;font-size:14px;line-height:20px;margin:0 0 30px;">
                Bonjour <strong>{{ pseudo }}</strong>,<br><br>
                Voici votre code de vérification :
              </p>
              <div style="background-color:#f8f8ff;border:2px dashed #6C63FF;border-radius:8px;padding:20px;margin:0 0 30px;">
                <span style="font-size:36px;font-weight:bold;color:#6C63FF;letter-spacing:8px;">{{ code }}</span>
              </div>
              <p style="color:#999999;font-size:12px;margin:0;">
                Ce code expire dans {{ expiry_minutes }} minutes.
              </p>
              <p style="color:#999999;font-size:12px;margin:16px 0 0;">
                Si vous n'avez pas demandé cette vérification, ignorez cet email.
              </p>
            </td>
          </tr>
          <tr>
            <td style="background-color:#f8f8ff;padding:20px 30px;text-align:center;">
              <p style="color:#999999;font-size:11px;margin:0;">&copy; {{ year }} Quizz Leka. Tous droits réservés.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
